<svg width="680" height="720" viewBox="0 0 680 720" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Arquitectura SEIP</title>
<desc>Diagrama de arquitectura de alto nivel: fuentes REData y ESIOS, ingesta batch y streaming vía Confluent Cloud, arquitectura Medallion Bronze/Silver/Gold en Databricks con Unity Catalog, y capa ML con MLflow generando un forecast de 24 horas.</desc>
<style>
  text { font-family: "Segoe UI", Arial, sans-serif; }
  .t { font-size: 14px; font-weight: 400; }
  .ts { font-size: 12px; font-weight: 400; }
  .th { font-size: 14px; font-weight: 700; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  .gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.75; }
  .gray text { fill: #2C2C2A; }
  .blue rect { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.75; }
  .blue text { fill: #0C447C; }
  .tealOuter rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.75; }
  .tealOuter text { fill: #085041; }
  .tealInner rect { fill: #9FE1CB; stroke: #0F6E56; stroke-width: 0.75; }
  .tealInner text { fill: #04342C; }
  .purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.75; }
  .purple text { fill: #3C3489; }
  svg { background: #FDFCFA; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="0" y="0" width="680" height="720" fill="#FDFCFA"/>

<g class="gray"><rect x="70" y="40" width="200" height="44" rx="8"/><text class="th" x="170" y="62" text-anchor="middle" dominant-baseline="central">REData API</text></g>
<g class="gray"><rect x="370" y="40" width="200" height="44" rx="8"/><text class="th" x="470" y="62" text-anchor="middle" dominant-baseline="central">ESIOS API</text></g>

<line x1="170" y1="84" x2="170" y2="150" class="arr" marker-end="url(#arrow)"/>
<line x1="470" y1="84" x2="470" y2="150" class="arr" marker-end="url(#arrow)"/>

<g class="blue"><rect x="70" y="150" width="200" height="56" rx="8"/><text class="th" x="170" y="170" text-anchor="middle" dominant-baseline="central">Ingesta batch</text><text class="ts" x="170" y="188" text-anchor="middle" dominant-baseline="central">PySpark, diario</text></g>
<g class="blue"><rect x="370" y="150" width="200" height="56" rx="8"/><text class="th" x="470" y="170" text-anchor="middle" dominant-baseline="central">Kafka producer</text><text class="ts" x="470" y="188" text-anchor="middle" dominant-baseline="central">run_once, 5-15 min</text></g>

<line x1="470" y1="206" x2="470" y2="260" class="arr" marker-end="url(#arrow)"/>

<g class="blue"><rect x="370" y="260" width="200" height="56" rx="8"/><text class="th" x="470" y="280" text-anchor="middle" dominant-baseline="central">Confluent Cloud</text><text class="ts" x="470" y="298" text-anchor="middle" dominant-baseline="central">Kafka gestionado</text></g>

<line x1="170" y1="206" x2="170" y2="430" class="arr" marker-end="url(#arrow)"/>

<path d="M470 316 L470 360 L210 360 L210 430" class="arr" marker-end="url(#arrow)"/>

<g class="tealOuter">
<rect x="60" y="360" width="560" height="190" rx="20"/>
<text class="th" x="340" y="392" text-anchor="middle">Databricks (Azure)</text>
<text class="ts" x="340" y="410" text-anchor="middle">Unity Catalog + Delta Lake</text>
</g>

<g class="tealInner"><rect x="95" y="430" width="150" height="90" rx="12"/><text class="th" x="170" y="458" text-anchor="middle" dominant-baseline="central">Bronze</text><text class="ts" x="170" y="480" text-anchor="middle" dominant-baseline="central">JSON crudo</text></g>
<g class="tealInner"><rect x="265" y="430" width="150" height="90" rx="12"/><text class="th" x="340" y="458" text-anchor="middle" dominant-baseline="central">Silver</text><text class="ts" x="340" y="480" text-anchor="middle" dominant-baseline="central">Tipado y validado</text></g>
<g class="tealInner"><rect x="435" y="430" width="150" height="90" rx="12"/><text class="th" x="510" y="458" text-anchor="middle" dominant-baseline="central">Gold</text><text class="ts" x="510" y="480" text-anchor="middle" dominant-baseline="central">KPIs + features</text></g>

<line x1="245" y1="475" x2="265" y2="475" class="arr" marker-end="url(#arrow)"/>
<line x1="415" y1="475" x2="435" y2="475" class="arr" marker-end="url(#arrow)"/>

<path d="M510 520 L510 570 L340 570 L340 620" class="arr" marker-end="url(#arrow)"/>

<g class="purple"><rect x="230" y="620" width="220" height="56" rx="8"/><text class="th" x="340" y="640" text-anchor="middle" dominant-baseline="central">ML — MLflow</text><text class="ts" x="340" y="658" text-anchor="middle" dominant-baseline="central">24 modelos, forecast 24h</text></g>

</svg>
